name: AI PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests-and-ai-summary:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Generate fallback PR summary
        if: ${{ env.OPENAI_API_KEY == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const body = [
              '### AI PR summary',
              '',
              'OPENAI_API_KEY is not configured, so this workflow published a deterministic fallback summary.',
              '',
              `Changed files: ${files.map(file => file.filename).join(', ') || 'none'}.`,
              '',
              'Automated tests were executed before this comment.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Generate OpenAI PR summary
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          diff = subprocess.check_output(["git", "diff", "origin/${{ github.base_ref }}...HEAD", "--stat"], text=True)
          prompt = f"Summarize this logistics API pull request for a reviewer. Mention risks and tests.\n\n{diff}"
          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=json.dumps({
                  "model": "gpt-4o-mini",
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.2,
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              summary = json.load(response)["choices"][0]["message"]["content"]
          owner, repo = os.environ["REPOSITORY"].split("/")
          comment_request = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{repo}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": "### AI PR summary\n\n" + summary}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(comment_request, timeout=30).read()
          PY
